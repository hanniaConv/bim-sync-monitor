<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>BIM Sync Monitor</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: #1f2937;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 6px 0 0;
      font-size: 14px;
      opacity: 0.8;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
      text-align: center;
    }

    select {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .sync-button {
      background: #facc15;
      color: #111827;
    }

    .finish-button {
      background: #22c55e;
      color: white;
    }

    .change-button {
      background: #e5e7eb;
      color: #374151;
    }

    .member {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      border-bottom: 1px solid #eee;
    }

    .member:last-child {
      border-bottom: none;
    }

    .member-name {
      font-weight: bold;
    }

    .status {
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 20px;
    }

    .available {
      background: #dcfce7;
      color: #166534;
    }

    .syncing {
      background: #fef3c7;
      color: #92400e;
    }

    .timer {
      font-size: 13px;
      margin-top: 4px;
      color: #6b7280;
    }

    .hidden {
      display: none;
    }

    .history-item {
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-user {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .history-info {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <header>
    <h1>🔄 BIM Sync Monitor</h1>
    <p>Monitor de sincronización del equipo</p>
  </header>

  <div class="container">

    <!-- SELECCIÓN DE USUARIO -->
    <div id="userSelection" class="card">

      <h2>¿Quién eres?</h2>

      <select id="userSelect">
        <option value="">Selecciona tu nombre</option>

        <option value="hannia">Hannia Márquez</option>
        <option value="angel">Angel Cruz</option>
        <option value="antonella">Antonella Tarantini</option>
        <option value="carlos">Carlos Ramírez</option>
        <option value="arianna">Arianna Nuñez</option>
        <option value="grace">Grace Martínez</option>
        <option value="cynthia">Cynthia Cortés</option>
        <option value="ximena">Ximena Arrambide</option>
        <option value="valeria">Valeria Garza</option>
        <option value="alejandro">Alejandro Ulla</option>
        <option value="gabriel">Gabriel Martínez</option>
        <option value="mauricio">Mauricio Mireles</option>

      </select>

      <button onclick="selectUser()" class="sync-button">
        CONTINUAR
      </button>

    </div>


    <!-- APLICACIÓN -->
    <div id="app" class="hidden">

      <div class="card">

        <h2 id="welcome"></h2>

        <button
          onclick="startSync()"
          id="startButton"
          class="sync-button">
          🟡 ESTOY SINCRONIZANDO
        </button>

        <button
          onclick="finishSync()"
          id="finishButton"
          class="finish-button">
          🟢 YA TERMINÉ
        </button>

        <button
          onclick="changeUser()"
          class="change-button">
          Cambiar usuario
        </button>

      </div>


      <!-- EQUIPO -->
      <div class="card">

        <h2>👥 Equipo</h2>

        <div id="teamList"></div>

      </div>


      <!-- HISTORIAL -->
      <div class="card">

        <h2>📋 Historial</h2>

        <div id="historyList">
          <p style="text-align:center;color:#6b7280;">
            Cargando historial...
          </p>
        </div>

      </div>

    </div>

  </div>


  <!-- FIREBASE -->
  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
      getDatabase,
      ref,
      set,
      get,
      push,
      onValue,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


    // ==========================================
    // CONFIGURACIÓN DE FIREBASE
    // ==========================================

    const firebaseConfig = {

      apiKey: "AIzaSyBgVpHHLmQN53E765Veab_cddpd63lJDfA",

      authDomain:
        "bim-sync-monitor.firebaseapp.com",

      databaseURL:
        "https://bim-sync-monitor-default-rtdb.firebaseio.com",

      projectId:
        "bim-sync-monitor",

      storageBucket:
        "bim-sync-monitor.firebasestorage.app",

      messagingSenderId:
        "853443748101",

      appId:
        "1:853443748101:web:c391d643ddd1916aaf176c"
    };


    // ==========================================
    // INICIALIZAR FIREBASE
    // ==========================================

    const app = initializeApp(firebaseConfig);

    const database = getDatabase(app);


    // Referencias

    const teamRef = ref(database, "Team");

    const historyRef = ref(database, "History");


    // ==========================================
    // DATOS DEL EQUIPO
    // ==========================================

    const members = {

      hannia: "Hannia Márquez",
      angel: "Angel Cruz",
      antonella: "Antonella Tarantini",
      carlos: "Carlos Ramírez",
      arianna: "Arianna Nuñez",
      grace: "Grace Martínez",
      cynthia: "Cynthia Cortés",
      ximena: "Ximena Arrambide",
      valeria: "Valeria Garza",
      alejandro: "Alejandro Ulla",
      gabriel: "Gabriel Martínez",
      mauricio: "Mauricio Mireles"

    };


    let currentUserId = null;
    let currentUserName = null;


    // ==========================================
    // SELECCIONAR USUARIO
    // ==========================================

    window.selectUser = async function() {

      const select =
        document.getElementById("userSelect");

      const userId = select.value;

      if (!userId) {

        alert("Selecciona tu nombre.");

        return;
      }


      currentUserId = userId;

      currentUserName = members[userId];


      localStorage.setItem(
        "bimUser",
        userId
      );


      // Crear usuario en Firebase

      const userRef =
        ref(database, `Team/${userId}`);


      await set(userRef, {

        name: currentUserName,

        status: "available",

        syncStarted: null

      });


      document
        .getElementById("userSelection")
        .classList.add("hidden");


      document
        .getElementById("app")
        .classList.remove("hidden");


      document
        .getElementById("welcome")
        .textContent =
        `Hola, ${currentUserName} 👋`;

    };


    // ==========================================
    // INICIAR SINCRONIZACIÓN
    // ==========================================

    window.startSync = async function() {

      if (!currentUserId) return;


      const userRef =
        ref(database, `Team/${currentUserId}`);


      await set(userRef, {

        name: currentUserName,

        status: "syncing",

        syncStarted: serverTimestamp()

      });

    };


    // ==========================================
    // TERMINAR SINCRONIZACIÓN
    // ==========================================

    window.finishSync = async function() {

      if (!currentUserId) return;


      const userRef =
        ref(database, `Team/${currentUserId}`);


      const snapshot =
        await get(userRef);


      if (!snapshot.exists()) {

        alert("No se encontró tu información.");

        return;
      }


      const userData =
        snapshot.val();


      if (
        userData.status !== "syncing" ||
        !userData.syncStarted
      ) {

        alert(
          "No tienes una sincronización activa."
        );

        return;
      }


      // Hora de inicio

      const startTime =
        Number(userData.syncStarted);


      // Hora de finalización

      const finishTime =
        Date.now();


      // Duración en segundos

      const durationSeconds =
        Math.max(
          0,
          Math.floor(
            (finishTime - startTime) / 1000
          )
        );


      const startDate =
        new Date(startTime);


      const finishDate =
        new Date(finishTime);


      // ==========================================
      // GUARDAR EN HISTORY
      // ==========================================

      const newHistoryRef =
        push(historyRef);


      await set(newHistoryRef, {

        userId:
          currentUserId,

        user:
          currentUserName,

        date:
          startDate.toLocaleDateString(
            "es-MX"
          ),

        startedAt:
          startDate.toLocaleTimeString(
            "es-MX"
          ),

        finishedAt:
          finishDate.toLocaleTimeString(
            "es-MX"
          ),

        durationSeconds:
          durationSeconds

      });


      // ==========================================
      // CAMBIAR ESTADO A DISPONIBLE
      // ==========================================

      await set(userRef, {

        name:
          currentUserName,

        status:
          "available",

        syncStarted:
          null

      });


      alert(
        `Sincronización registrada.\n\nDuración: ${formatDuration(durationSeconds)}`
      );

    };


    // ==========================================
    // FORMATO DE DURACIÓN
    // ==========================================

    function formatDuration(seconds) {

      const minutes =
        Math.floor(seconds / 60);

      const remainingSeconds =
        seconds % 60;


      if (minutes === 0) {

        return `${remainingSeconds} segundos`;

      }


      return `${minutes} min ${remainingSeconds} s`;

    }


    // ==========================================
    // CAMBIAR USUARIO
    // ==========================================

    window.changeUser = function() {

      localStorage.removeItem(
        "bimUser"
      );


      currentUserId = null;

      currentUserName = null;


      document
        .getElementById("app")
        .classList.add("hidden");


      document
        .getElementById("userSelection")
        .classList.remove("hidden");


      document
        .getElementById("userSelect")
        .value = "";

    };


    // ==========================================
    // MOSTRAR EQUIPO EN TIEMPO REAL
    // ==========================================

    onValue(teamRef, (snapshot) => {

      const data =
        snapshot.val() || {};


      const teamList =
        document.getElementById(
          "teamList"
        );


      teamList.innerHTML = "";


      Object.keys(members).forEach(
        (userId) => {

          const member =
            data[userId] || {

              name:
                members[userId],

              status:
                "available",

              syncStarted:
                null

            };


          const div =
            document.createElement(
              "div"
            );


          div.className =
            "member";


          const left =
            document.createElement(
              "div"
            );


          const name =
            document.createElement(
              "div"
            );


          name.className =
            "member-name";


          name.textContent =
            member.name;


          left.appendChild(name);


          // ==================================
          // TIMER
          // ==================================

          if (
            member.status ===
              "syncing" &&
            member.syncStarted
          ) {

            const timer =
              document.createElement(
                "div"
              );


            timer.className =
              "timer";


            const updateTimer =
              () => {

                const seconds =
                  Math.floor(
                    (
                      Date.now() -
                      Number(
                        member.syncStarted
                      )
                    ) / 1000
                  );


                timer.textContent =
                  `⏱️ ${formatDuration(
                    Math.max(
                      0,
                      seconds
                    )
                  )}`;

              };


            updateTimer();


            setInterval(
              updateTimer,
              1000
            );


            left.appendChild(timer);

          }


          const status =
            document.createElement(
              "div"
            );


          status.className =
            "status " +
            (
              member.status ===
              "syncing"
                ? "syncing"
                : "available"
            );


          status.textContent =
            member.status ===
            "syncing"

              ? "🟡 Sincronizando"

              : "🟢 Disponible";


          div.appendChild(left);

          div.appendChild(status);


          teamList.appendChild(div);

        }
      );

    });


    // ==========================================
    // MOSTRAR HISTORY
    // ==========================================

    onValue(historyRef, (snapshot) => {

      const data =
        snapshot.val() || {};


      const historyList =
        document.getElementById(
          "historyList"
        );


      historyList.innerHTML = "";


      const entries =
        Object.values(data);


      // Mostrar los más recientes primero

      entries.reverse();


      if (entries.length === 0) {

        historyList.innerHTML = `

          <p style="
            text-align:center;
            color:#6b7280;
          ">
            Todavía no hay registros.
          </p>

        `;

        return;
      }


      entries.forEach((entry) => {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "history-item";


        div.innerHTML = `

          <div class="history-user">

            👤 ${entry.user}

          </div>

          <div class="history-info">

            📅 ${entry.date}<br>

            🟡 Inicio:
            ${entry.startedAt}<br>

            🟢 Final:
            ${entry.finishedAt}<br>

            ⏱️ Duración:
            ${formatDuration(
              entry.durationSeconds
            )}

          </div>

        `;


        historyList.appendChild(div);

      });

    });


    // ==========================================
    // RECUPERAR USUARIO GUARDADO
    // ==========================================

    const savedUser =
      localStorage.getItem(
        "bimUser"
      );


    if (savedUser &&
        members[savedUser]) {

      currentUserId =
        savedUser;

      currentUserName =
        members[savedUser];


      document
        .getElementById(
          "userSelection"
        )
        .classList.add("hidden");


      document
        .getElementById("app")
        .classList.remove("hidden");


      document
        .getElementById("welcome")
        .textContent =
        `Hola, ${currentUserName} 👋`;

    }

  </script>

</body>
</html>
