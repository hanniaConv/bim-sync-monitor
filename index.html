<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIM Sync Monitor</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 24px;
        }

        header p {
            margin-top: 5px;
            color: #cbd5e1;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .enter-button {
            background: #2563eb;
            color: white;
        }

        .sync-button {
            background: #f59e0b;
            color: white;
        }

        .finish-button {
            background: #22c55e;
            color: white;
        }

        .logout-button {
            background: #e5e7eb;
            color: #374151;
        }

        .status {
            text-align: center;
            padding: 15px;
            margin-top: 15px;
            border-radius: 10px;
            background: #ecfdf5;
            color: #15803d;
            font-weight: bold;
        }

        .team-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .person {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #e5e7eb;
            gap: 10px;
        }

        .person:last-child {
            border-bottom: none;
        }

        .person-name {
            font-weight: bold;
        }

        .available {
            color: #16a34a;
        }

        .syncing {
            color: #d97706;
        }

        .hidden {
            display: none;
        }

        .welcome {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>BIM Sync Monitor</h1>
    <p>Electrical Project</p>
</header>


<!-- PANTALLA PARA PONER EL NOMBRE -->

<div id="loginScreen" class="container">

    <div class="card">

        <h2>👋 Bienvenido</h2>

        <p style="margin-bottom: 15px;">
            Escribe tu nombre para entrar al equipo.
        </p>

        <input
            type="text"
            id="nameInput"
            placeholder="Tu nombre"
            maxlength="30"
        >

        <button class="enter-button" onclick="enterTeam()">
            ENTRAR
        </button>

    </div>

</div>


<!-- PANTALLA PRINCIPAL -->

<div id="appScreen" class="container hidden">

    <div class="card">

        <div id="welcomeMessage" class="welcome">
            Hola 👋
        </div>

        <button class="sync-button" onclick="startSync()">
            🟡 ESTOY SINCRONIZANDO
        </button>

        <button class="finish-button" onclick="finishSync()">
            🟢 YA TERMINÉ
        </button>

        <div id="myStatus" class="status">
            🟢 Disponible
        </div>

        <button class="logout-button" onclick="logout()">
            Cambiar nombre
        </button>

    </div>


    <!-- EQUIPO -->

    <div class="card">

        <div class="team-title">
            👥 Equipo
        </div>

        <div id="teamList">
            Cargando equipo...
        </div>

    </div>

</div>


<script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
        getDatabase,
        ref,
        set,
        onValue,
        remove
    }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


    // FIREBASE

    const firebaseConfig = {
        apiKey: "AIzaSyBgVpHHLmQN53E765Veab_cddpd63lJDfA",
        authDomain: "bim-sync-monitor.firebaseapp.com",
        databaseURL: "https://bim-sync-monitor-default-rtdb.firebaseio.com",
        projectId: "bim-sync-monitor",
        storageBucket: "bim-sync-monitor.firebasestorage.app",
        messagingSenderId: "853443748101",
        appId: "1:853443748101:web:c391d643ddd1916aaf176c"
    };


    const app = initializeApp(firebaseConfig);

    const database = getDatabase(app);


    // USUARIO ACTUAL

    let currentUser = localStorage.getItem("bimUser");


    // MOSTRAR PANTALLA CORRESPONDIENTE

    if (currentUser) {

        showApp();

    }


    // ENTRAR AL EQUIPO

    window.enterTeam = function() {

        const input =
            document.getElementById("nameInput");

        const name =
            input.value.trim();


        if (!name) {

            alert("Escribe tu nombre.");

            return;
        }


        currentUser = name;

        localStorage.setItem("bimUser", name);

        showApp();

    };


    // MOSTRAR APP

    function showApp() {

        document
            .getElementById("loginScreen")
            .classList.add("hidden");

        document
            .getElementById("appScreen")
            .classList.remove("hidden");

        document
            .getElementById("welcomeMessage")
            .innerHTML =
            "Hola, " + currentUser + " 👋";


        const userRef =
            ref(database, "team/" + safeKey(currentUser));


        set(userRef, {

            name: currentUser,

            status: "available",

            syncStarted: ""

        });

    }


    // CONVERTIR NOMBRE EN UNA CLAVE SEGURA

    function safeKey(name) {

        return name
            .toLowerCase()
            .replace(/[.#$[\]]/g, "")
            .replace(/\s+/g, "_");

    }


    // COMENZAR SINCRONIZACIÓN

    window.startSync = function() {

        const userRef =
            ref(database, "team/" + safeKey(currentUser));


        set(userRef, {

            name: currentUser,

            status: "syncing",

            syncStarted:
                new Date().toLocaleTimeString()

        });


        document
            .getElementById("myStatus")
            .innerHTML =
            "🟡 Sincronizando...";


        document
            .getElementById("myStatus")
            .style.background =
            "#fffbeb";


        document
            .getElementById("myStatus")
            .style.color =
            "#d97706";

    };


    // TERMINAR SINCRONIZACIÓN

    window.finishSync = function() {

        const userRef =
            ref(database, "team/" + safeKey(currentUser));


        set(userRef, {

            name: currentUser,

            status: "available",

            syncStarted: ""

        });


        document
            .getElementById("myStatus")
            .innerHTML =
            "🟢 Disponible";


        document
            .getElementById("myStatus")
            .style.background =
            "#ecfdf5";


        document
            .getElementById("myStatus")
            .style.color =
            "#15803d";

    };


    // CAMBIAR DE USUARIO

    window.logout = function() {

        localStorage.removeItem("bimUser");

        location.reload();

    };


    // ESCUCHAR CAMBIOS DEL EQUIPO

    const teamRef =
        ref(database, "team");


    onValue(teamRef, (snapshot) => {

        const data = snapshot.val();

        const teamList =
            document.getElementById("teamList");


        teamList.innerHTML = "";


        if (!data) {

            teamList.innerHTML =
                "No hay integrantes todavía.";

            return;

        }


        Object.values(data).forEach(person => {

            const div =
                document.createElement("div");


            div.className = "person";


            if (person.status === "syncing") {

                div.innerHTML = `

                    <span class="person-name">
                        ${person.name}
                    </span>

                    <span class="syncing">
                        🟡 Sincronizando
                    </span>

                `;

            } else {

                div.innerHTML = `

                    <span class="person-name">
                        ${person.name}
                    </span>

                    <span class="available">
                        🟢 Disponible
                    </span>

                `;

            }


            teamList.appendChild(div);

        });

    });

</script>

</body>
</html>
