<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BIM Sync Monitor</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 25px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      margin-bottom: 8px;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      color: #6b7280;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .card h2 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 20px;
    }

    .user-button {
      width: 100%;
      padding: 16px;
      margin-bottom: 12px;
      border: none;
      border-radius: 10px;
      background: #e5e7eb;
      font-size: 17px;
      cursor: pointer;
      transition: 0.2s;
    }

    .user-button:hover {
      background: #d1d5db;
    }

    .hidden {
      display: none;
    }

    .welcome {
      text-align: center;
      margin-bottom: 25px;
    }

    .welcome h2 {
      margin-bottom: 5px;
    }

    .sync-button {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 12px;
      background: #facc15;
      color: #111827;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .finish-button {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 12px;
      background: #22c55e;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .team {
      margin-top: 30px;
    }

    .team h3 {
      margin-bottom: 15px;
    }

    .member {
      background: #f9fafb;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status {
      font-size: 14px;
      font-weight: bold;
    }

    .available {
      color: #16a34a;
    }

    .syncing {
      color: #ca8a04;
    }

    .change-user {
      display: block;
      margin: 20px auto 0;
      background: none;
      border: none;
      color: #2563eb;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- PANTALLA DE SELECCIÓN -->
  <div id="loginScreen" class="container">

    <div class="header">
      <h1>BIM Sync Monitor</h1>
      <p>Electrical Project</p>
    </div>

    <div class="card">

      <h2>¿Quién eres?</h2>

      <button class="user-button" onclick="selectUser('Hannia Marquez')">
        👩🏻 Hannia Márquez
      </button>

      <button class="user-button" onclick="selectUser('Ángel Cruz')">
        👨🏻 Angel Cruz
      </button>

      <button class="user-button" onclick="selectUser('Atonella Tarantini')">
        👩🏻 Antonella Tarantini
      </button>

      <button class="user-button" onclick="selectUser('Carlos Ramirez')">
        👨🏻 Carlos Ramírez
      </button>
        
        <button class="user-button" onclick="selectUser('Arianna Nuñez')">
        👩🏻 Arianna Nuñez
      </button>
        
        <button class="user-button" onclick="selectUser('Grace Martinez')">
        👩🏻 Grace Martínez
      </button>
        
        <button class="user-button" onclick="selectUser('Cynthia Cortes')">
        👩🏻 Cynthia Cortés
      </button>
        
        <button class="user-button" onclick="selectUser('Ximena Arrambide')">
        👩🏻 Ximena Arrambide
      </button>

        <button class="user-button" onclick="selectUser('Valeria Garza')">
        👩🏻 Valeria Garza
      </button>

        <button class="user-button" onclick="selectUser('Alejandro Ulla')">
        👨🏻 Alejandro Ulla
      </button>

        <button class="user-button" onclick="selectUser('Gabriel Martinez')">
        👨🏻 Gabriel Martínez
      </button>

        <button class="user-button" onclick="selectUser('Mauricio Mireles')">
        👨🏻 Mauricio Mireles
      </button>

    </div>

  </div>


  <!-- APLICACIÓN -->
  <div id="appScreen" class="container hidden">

    <div class="header">
      <h1>BIM Sync Monitor</h1>
      <p>Electrical Project</p>
    </div>

    <div class="card">

      <div class="welcome">
        <h2 id="userName"></h2>
        <p>Selecciona tu estado</p>
      </div>

      <button class="sync-button">
        🟡 ESTOY SINCRONIZANDO
      </button>

      <button class="finish-button">
        🟢 YA TERMINÉ
      </button>

      <div class="team">

        <h3>Equipo</h3>

        <div class="member">
          <span>Hannia</span>
          <span class="status available">Disponible</span>
        </div>

        <div class="member">
          <span>Carlos</span>
          <span class="status available">Disponible</span>
        </div>

        <div class="member">
          <span>Andrea</span>
          <span class="status available">Disponible</span>
        </div>

        <div class="member">
          <span>Luis</span>
          <span class="status available">Disponible</span>
        </div>

      </div>

      <button class="change-user" onclick="changeUser()">
        Cambiar usuario
      </button>

    </div>

  </div>


  <script>

    function selectUser(name) {

      localStorage.setItem("bimUser", name);

      document.getElementById("loginScreen").classList.add("hidden");

      document.getElementById("appScreen").classList.remove("hidden");

      document.getElementById("userName").textContent = "Hola, " + name;
    }


    function changeUser() {

      localStorage.removeItem("bimUser");

      document.getElementById("appScreen").classList.add("hidden");

      document.getElementById("loginScreen").classList.remove("hidden");
    }


    // Mantener al usuario seleccionado
    window.onload = function() {

      const savedUser = localStorage.getItem("bimUser");

      if (savedUser) {

        document.getElementById("loginScreen").classList.add("hidden");

        document.getElementById("appScreen").classList.remove("hidden");

        document.getElementById("userName").textContent =
          "Hola, " + savedUser;
      }

    };

  </script>

</body>
</html>
